# Runs the test suite on every push. The tests use a fake Freshdesk, so CI
# needs no API key and no secrets: nothing sensitive ever reaches GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -v
      - name: The rules still print
        run: python -m scripts.print_rules > /dev/null
